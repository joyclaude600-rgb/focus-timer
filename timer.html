<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --ink: #172b4d; --muted: #5e6c84; --line: #dfe1e6;
    --accent: #d9553b; --accent-soft: #fbe7e2; --break: #2f8f6b; --break-soft: #dff1e9;
    --spotify: #1db954;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; }
  body.break { --accent: var(--break); --accent-soft: var(--break-soft); }
  main { padding: 16px; text-align: center; max-width: 480px; margin: 0 auto; }

  .modes { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .modes button { border: 0; background: none; color: var(--muted); padding: 6px 12px;
    border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  .modes button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .ring { position: relative; width: 220px; height: 220px; margin: 0 auto; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--line); }
  .ring .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
  .time { position: absolute; inset: 0; display: grid; place-content: center; }
  .time b { font-size: 52px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .time span { color: var(--muted); font-size: 13px; }

  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 9px 16px; border-radius: 8px; font: inherit; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 110px; font-weight: 600; }
  .player { margin-top: 14px; }
  .player .embed { border-radius: 12px; overflow: hidden; min-height: 152px; }
  .player a { display: inline-block; margin-top: 6px; font-size: 12px; color: #127a37; }
  .card { margin-top: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .stats { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .msg { font-size: 13px; color: var(--accent); min-height: 1.2em; margin-top: 6px; }

  details { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; text-align: left; }
  summary { padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .settings { padding: 0 14px 14px; display: grid; gap: 10px; font-size: 14px; }
  .lengths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .settings label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
  .settings label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .settings input[type=number], .settings input[type=url] { padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); font: inherit; color: var(--ink); width: 100%; min-width: 0; }
  .settings input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="modes" id="modes">
    <button data-mode="focus">Focus</button>
    <button data-mode="short">Short break</button>
    <button data-mode="long">Long break</button>
  </div>
  <div class="ring">
    <svg width="220" height="220"><circle class="track" cx="110" cy="110" r="98"/>
      <circle class="prog" id="prog" cx="110" cy="110" r="98"/></svg>
    <div class="time"><b id="clock">25:00</b><span id="phase">Focus</span></div>
  </div>
  <div class="controls">
    <button class="btn primary" id="toggle">Start</button>
    <button class="btn" id="reset">Reset</button>
    <button class="btn" id="skip" title="End this session now">Skip</button>
  </div>
  <div class="card" id="cardName"></div>
  <div class="stats" id="stats"></div>
  <div class="msg" id="msg"></div>
  <div class="player" id="player" hidden>
    <div class="embed"><div id="embed"></div></div>
    <a id="openSpotify" target="_blank" rel="noopener">Open in Spotify</a>
  </div>

  <details id="settingsPanel">
    <summary>Settings</summary>
    <div class="settings">
      <div class="lengths">
        <label>Focus (min) <input type="number" id="sFocus" min="1" max="180"></label>
        <label>Short break <input type="number" id="sShort" min="1" max="60"></label>
        <label>Long break <input type="number" id="sLong" min="1" max="90"></label>
      </div>
      <label>Long break after every <input type="number" id="sEvery" min="2" max="10"> focus sessions</label>
      <label>Spotify link (playlist, album or track)
        <input type="url" id="sSpotify" placeholder="https://open.spotify.com/playlist/…"></label>
      <label class="check"><input type="checkbox" id="sAutoMusic"> Play music during focus sessions and pause it on breaks</label>
      <div><button class="btn primary" id="sSave" style="min-width:0">Save settings</button></div>
    </div>
  </details>
  <div class="note">Keep this window open while the timer runs. Skipping a focus session logs the time you spent if it's at least a minute. · v4</div>
</main>

<script>
const DEFAULTS = { focus: 25, short: 5, long: 15, every: 4, spotifyUrl: '', autoMusic: true };
const C = 2 * Math.PI * 98;
const $ = id => document.getElementById(id);
const prog = $('prog');
prog.style.strokeDasharray = C;

// Inside Trello this talks to the card; opened on its own it still works as a plain timer.
let t = null;
try { if (window.parent !== window) t = TrelloPowerUp.iframe(); } catch {}

let settings = { ...DEFAULTS };
let mode = 'focus', remaining = settings.focus * 60, endsAt = null, tick = null;
let streak = 0, cardData = {}, audio = null;

function secs(m) { return settings[m] * 60; }
function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function fmtDur(sec) {
  const m = Math.round(sec / 60);
  if (m < 60) return m + ' min';
  return Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
}
function localDay(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function say(text) { $('msg').textContent = text; }

function render() {
  $('clock').textContent = fmt(remaining);
  prog.style.strokeDashoffset = C * (1 - remaining / secs(mode));
  $('toggle').textContent = endsAt ? 'Pause' : (remaining < secs(mode) ? 'Resume' : 'Start');
  $('phase').textContent = mode === 'focus' ? 'Focus' : 'Take a breather';
  document.body.classList.toggle('break', mode !== 'focus');
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const p = cardData.pomos || 0, sec = cardData.focusSec || 0;
  $('stats').textContent = `🍅 ${p} session${p === 1 ? '' : 's'} · ${fmtDur(sec)} focused on this card`;
}

function setMode(m) { pause(); mode = m; remaining = secs(m); render(); }

function start() {
  if (endsAt) return;
  if (!audio) try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  if (mode === 'focus' && settings.autoMusic) musicPlay();
  endsAt = Date.now() + remaining * 1000;
  tick = setInterval(() => {
    remaining = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
    render();
    if (remaining === 0) finish(secs('focus'));
  }, 250);
  render();
}
function pause() {
  const wasRunning = !!endsAt;
  clearInterval(tick); tick = null; endsAt = null;
  if (wasRunning && settings.autoMusic) musicPause();
  render();
}

// spent = focus seconds actually used in this session
async function finish(spent) {
  pause();
  chime();
  if (mode === 'focus') {
    if (spent >= 60) {
      streak++;
      await logFocus(spent);
    } else {
      say('Less than a minute, so nothing was logged.');
    }
    setMode(streak > 0 && streak % settings.every === 0 ? 'long' : 'short');
  } else {
    setMode('focus');
  }
}

async function logFocus(spent) {
  if (!t) { // standalone: keep it in memory only
    cardData.pomos = (cardData.pomos || 0) + 1;
    cardData.focusSec = (cardData.focusSec || 0) + spent;
    say(`Logged ${fmtDur(spent)}.`);
    return render();
  }
  try {
    const d = await t.get('card', 'shared');
    const log = d.log || {};
    const day = localDay();
    log[day] = (log[day] || 0) + spent;
    // keep ~4 months of daily totals so the card's storage stays small
    const cutoff = localDay(new Date(Date.now() - 120 * 864e5));
    for (const k of Object.keys(log)) if (k < cutoff) delete log[k];
    cardData = { pomos: (d.pomos || 0) + 1, focusSec: (d.focusSec || 0) + spent, log };
    await t.set('card', 'shared', cardData);
    say(`Logged ${fmtDur(spent)} on this card.`);
  } catch (err) {
    say('Could not save to Trello: ' + (err && err.message || err));
  }
  render();
}

// ---- Spotify: an embedded player the timer plays and pauses ----
let spotifyApi = null, controller = null, loadedUri = '', musicStarted = false, musicPaused = true;

function spotifyUri(url) {
  const m = /^https:\/\/open\.spotify\.com\/(?:intl-[\w-]+\/)?(playlist|album|track|artist|episode|show)\/([A-Za-z0-9]+)/
    .exec((url || '').trim());
  return m ? `spotify:${m[1]}:${m[2]}` : '';
}

function setupPlayer() {
  const uri = spotifyUri(settings.spotifyUrl);
  $('player').hidden = !uri;
  if (!uri) { if (controller) controller.pause(); return; }
  $('openSpotify').href = settings.spotifyUrl;
  if (plainPlayer) {
    if (uri !== loadedUri) { const [, type, id] = uri.split(':'); $('embed').src = `https://open.spotify.com/embed/${type}/${id}`; loadedUri = uri; }
    return;
  }
  if (!spotifyApi || uri === loadedUri) return;
  loadedUri = uri; musicStarted = false;
  if (controller) return controller.loadUri(uri);
  spotifyApi.createController($('embed'), { uri, width: '100%', height: 152 }, c => {
    controller = c;
    c.addListener('playback_update', e => { musicPaused = e.data.isPaused; });
  });
}

function musicPlay() {
  if (!controller) return;
  if (!musicStarted) { controller.play(); musicStarted = true; }
  else if (musicPaused) controller.resume();
}
function musicPause() { if (controller && !musicPaused) controller.pause(); }

// If Spotify's control script can't load (some browsers block it inside Trello),
// fall back to a plain embedded player you press play on yourself.
let plainPlayer = false;
function setupPlainPlayer() {
  const uri = spotifyUri(settings.spotifyUrl);
  if (spotifyApi || !uri) return;
  plainPlayer = true;
  const [, type, id] = uri.split(':');
  $('embed').outerHTML = `<iframe id="embed" src="https://open.spotify.com/embed/${type}/${id}" width="100%" height="152"
    frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
  loadedUri = uri;
  say('Press ▶ on the player to start your music.');
}

window.onSpotifyIframeApiReady = api => { spotifyApi = api; if (!plainPlayer) setupPlayer(); };
const spotifyScript = document.createElement('script');
spotifyScript.src = 'https://open.spotify.com/embed/iframe-api/v1';
spotifyScript.async = true;
spotifyScript.onerror = () => setupPlainPlayer();
document.head.appendChild(spotifyScript);
setTimeout(setupPlainPlayer, 6000);

function chime() {
  if (!audio) return;
  try {
    [660, 880, 990].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      const t0 = audio.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      o.start(t0); o.stop(t0 + 0.5);
    });
  } catch {}
}

// ---- settings (saved privately to your Trello account; in this browser when standalone) ----
function fillSettings() {
  $('sFocus').value = settings.focus; $('sShort').value = settings.short; $('sLong').value = settings.long;
  $('sEvery').value = settings.every; $('sSpotify').value = settings.spotifyUrl; $('sAutoMusic').checked = settings.autoMusic;
}
function clampInt(v, lo, hi, dflt) { v = parseInt(v, 10); return isNaN(v) ? dflt : Math.min(hi, Math.max(lo, v)); }

async function loadSettings() {
  let s = null;
  try { s = t ? await t.get('member', 'private', 'settings') : JSON.parse(localStorage.getItem('focus-settings')); } catch {}
  settings = { ...DEFAULTS, ...(s || {}) };
  fillSettings();
  if (!endsAt) { remaining = secs(mode); }
  setupPlayer();
  render();
}

$('sSave').onclick = async () => {
  const url = $('sSpotify').value.trim();
  if (url && !spotifyUri(url)) {
    return say('That doesn\'t look like a Spotify playlist, album or track link. In Spotify, use Share > Copy link.');
  }
  settings = {
    focus: clampInt($('sFocus').value, 1, 180, DEFAULTS.focus),
    short: clampInt($('sShort').value, 1, 60, DEFAULTS.short),
    long: clampInt($('sLong').value, 1, 90, DEFAULTS.long),
    every: clampInt($('sEvery').value, 2, 10, DEFAULTS.every),
    spotifyUrl: url,
    autoMusic: $('sAutoMusic').checked
  };
  fillSettings();
  try {
    if (t) await t.set('member', 'private', 'settings', settings);
    else localStorage.setItem('focus-settings', JSON.stringify(settings));
  } catch {}
  if (!endsAt) remaining = secs(mode); // a running session keeps its length; the new ones apply next
  setupPlayer();
  render();
  say(endsAt ? 'Saved. New lengths start with the next session.' : 'Settings saved.');
};

$('toggle').onclick = () => endsAt ? pause() : start();
$('reset').onclick = () => setMode(mode);
$('skip').onclick = () => finish(mode === 'focus' ? secs('focus') - remaining : 0);
$('modes').onclick = e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); endsAt ? pause() : start(); }
});

if (t) {
  t.card('name').then(c => { $('cardName').textContent = c.name; }).catch(() => {});
  t.get('card', 'shared').then(d => { cardData = d || {}; render(); }).catch(() => {});
}
loadSettings();
render();
</script>
</body>
</html>
